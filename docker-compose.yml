
services:
  postgres:
    image: postgres:18
    container_name: anonymizer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anonymizer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: anonymizer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
